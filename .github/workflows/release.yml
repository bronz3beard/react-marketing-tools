name: Release

# Pushing a vX.Y.Z tag releases that version; `npm run release` creates and pushes it from main (docs/releasing.md).
# This workflow checks the tag again, runs every CI check, stages the package on npm through trusted publishing (OIDC,
# no npm token) with provenance, then creates the GitHub Release: the version's changelog section as notes, with the
# tarball, a CycloneDX SBOM, and the SLSA build provenance that signs both (`.sigstore.json` for
# `gh attestation verify`, `.intoto.jsonl` for provenance tooling) attached. Nothing is installable until a maintainer
# approves the staged version with 2FA (`npm stage approve` or npmjs.com). A version with a `-` (1.1.0-rc.0) goes to the `next` dist-tag as a pre-release;
# any other goes to `latest`.
# One-time setup on npmjs.com: package settings → Trusted Publisher → GitHub Actions, user `bronz3beard`,
# repository `react-marketing-tools`, workflow `release.yml`, "Allow npm publish" unticked (staged publishing only).
# Without it, the stage step fails and nothing is staged.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      # Full history, so the tagged commit can be checked against origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag matches main, package.json and the changelog
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG isn't vX.Y.Z or vX.Y.Z-prerelease."
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match package.json version $version (expected v$version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that isn't on main. Only merged, reviewed commits are released."
            exit 1
          fi
          if ! node scripts/changelog-section.mjs "$version" > /dev/null; then
            echo "::error::docs/CHANGELOG.md has no usable \"## [$version]\" section."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  verify:
    needs: check
    uses: ./.github/workflows/ci.yml

  # Builds the tarball the GitHub Release carries, writes its SBOM, and signs both with SLSA build provenance. npm
  # publishes its own build in `publish`, with npm's provenance.
  build:
    needs: [check, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # `npm pack` doesn't run prepublishOnly, so build and size-check first, as a publish does.
      - run: npm run build && npm run check:size
      # Runtime dependencies only, read from the lockfile: what installing the package brings in. There are none today,
      # so the SBOM lists no components; peer dependencies (React, web-vitals, FingerprintJS) are the app's own.
      - name: Pack the tarball and write the SBOM
        run: |
          npm pack --ignore-scripts
          test -f "react-marketing-tools-$VERSION.tgz"
          npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > "react-marketing-tools-$VERSION.cdx.json"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: |
            react-marketing-tools-${{ needs.check.outputs.version }}.tgz
            react-marketing-tools-${{ needs.check.outputs.version }}.cdx.json
      - name: Keep the signed bundle and its provenance envelope
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "react-marketing-tools-$VERSION.sigstore.json"
          node scripts/provenance-envelope.mjs "$BUNDLE" > "react-marketing-tools-$VERSION.intoto.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: react-marketing-tools-${{ needs.check.outputs.version }}.*
          if-no-files-found: error

  publish:
    needs: [check, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DIST_TAG: ${{ needs.check.outputs.prerelease == 'true' && 'next' || 'latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Staged publishing needs `npm stage`: npm 11.11 (bundled with Node 24) doesn't have it; npm 11.19 (Node 26) does.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: Check npm supports staged publishing
        run: |
          if ! npm stage --help > /dev/null 2>&1; then
            echo "::error::npm $(npm --version) has no 'npm stage' command, which staged publishing needs."
            exit 1
          fi
      - run: npm ci
      # `npm stage publish` runs prepublishOnly (build + size check) like `npm publish`, then uploads the package for
      # approval instead of publishing it.
      - run: npm stage publish --tag "$DIST_TAG"

  # Separate from publish so no job holds both the npm OIDC token and write access to the repository.
  # Every asset is attached as the release is created: once published, an immutable release can't take more.
  release:
    needs: [check, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: assets
      - name: Write the release notes
        run: |
          {
            node scripts/changelog-section.mjs "$VERSION"
            printf '\n---\n\n'
            printf "Install with \`npm install react-marketing-tools@%s\` once the staged version is approved. " "$VERSION"
            printf 'npm adds its own [provenance](https://www.npmjs.com/package/react-marketing-tools/v/%s#provenance).\n\n' "$VERSION"
            printf "The tarball and \`react-marketing-tools-%s.cdx.json\` (the CycloneDX software bill of materials) " "$VERSION"
            printf 'are signed with SLSA build provenance. Verify the tarball with:\n\n'
            printf "\`\`\`sh\ngh attestation verify react-marketing-tools-%s.tgz -R bronz3beard/react-marketing-tools\n\`\`\`\n" "$VERSION"
          } > notes.md
      - name: Create the GitHub Release
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}" assets/*
